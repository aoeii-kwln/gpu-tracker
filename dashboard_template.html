<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU 価格推移ダッシュボード</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f5f6f8;
    --white:     #ffffff;
    --border:    #e4e6ea;
    --text:      #1a1d23;
    --muted:     #6b7280;
    --accent:    #2563eb;
    --green:     #16a34a;
    --red:       #dc2626;
    --yellow:    #d97706;
    --nvidia:    #76b900;
    --amd:       #ed1c24;
    --shadow:    0 1px 4px rgba(0,0,0,.08);
    --radius:    10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Hiragino Sans', 'Meiryo', 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Header ── */
  header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .site-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .site-title-icon {
    background: var(--accent);
    color: #fff;
    width: 28px; height: 28px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .header-meta {
    font-size: 12px;
    color: var(--muted);
  }

  /* ── Layout ── */
  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* ── Pick Up ── */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .pickup-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 28px;
  }
  .pickup-item {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
  }
  .pickup-item.up   { border-left: 3px solid var(--red);   }
  .pickup-item.down { border-left: 3px solid var(--green); }
  .pickup-item.new  { border-left: 3px solid var(--accent);}
  .pickup-icon { font-size: 18px; }
  .pickup-text { flex: 1; font-size: 13px; font-weight: 500; }
  .pickup-date { font-size: 11px; color: var(--muted); }
  .pickup-badge {
    font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 20px;
  }
  .badge-up   { background: #fef2f2; color: var(--red);   }
  .badge-down { background: #f0fdf4; color: var(--green); }
  .badge-new  { background: #eff6ff; color: var(--accent);}
  .pickup-badge { white-space: nowrap; }
  .pickup-date { white-space: nowrap; }
  .pickup-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; cursor:pointer; user-select:none;
    background:var(--white); border:1px solid var(--border); border-radius:8px; padding:8px 12px; box-shadow:var(--shadow);
    margin-bottom:8px; }
  .pickup-head:hover { background:#f9fafb; }
  .pickup-head:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .pickup-head.collapsed { margin-bottom:28px; }
  .pickup-head .caret { font-size:10px; color:var(--muted); width:12px; }
  .pickup-count { font-size:11px; font-weight:700; text-transform:none; letter-spacing:0; color:var(--accent);
    background:#eff6ff; padding:2px 10px; border-radius:20px; }
  .pickup-list[hidden] { display:none; }
  .pickup-older { display:flex; flex-direction:column; gap:6px; }
  .pickup-older[hidden] { display:none; }
  .pickup-more { align-self:flex-start; border:1px solid var(--border); background:var(--white); color:var(--accent);
    font-size:12px; font-weight:700; padding:6px 14px; border-radius:20px; cursor:pointer; }
  .pickup-more:hover { background:#eff6ff; }

  /* ── Filter tabs ── */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    width: fit-content;
    box-shadow: var(--shadow);
  }
  .tab {
    padding: 6px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    transition: all .15s;
  }
  .tab.active {
    background: var(--accent);
    color: #fff;
  }

  /* ── GPU Cards ── */
  .gpu-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .gpu-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* Card top bar */
  .card-top {
    padding: 16px 20px 12px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .card-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vendor-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: .04em;
  }
  .badge-nvidia { background: #e8f5d0; color: #3a6300; }
  .badge-amd    { background: #fde8e8; color: #9b1c1c; }
  .card-name {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
  }
  .card-price-block {
    text-align: right;
  }
  .card-min-label {
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .card-min-price {
    font-size: 28px;
    font-weight: 900;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .card-change {
    font-size: 13px;
    font-weight: 700;
    margin-top: 2px;
  }
  .change-up   { color: var(--red);   }
  .change-down { color: var(--green); }
  .change-flat { color: var(--muted); }

  /* Chart area */
  .card-chart {
    padding: 16px 20px 8px;
    height: 220px;
    position: relative;
  }

  /* Source table */
  .card-sources {
    padding: 0 20px 16px;
  }
  .sources-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .source-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 6px;
  }
  .source-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .source-item.best {
    background: #f0fdf4;
    border-color: #bbf7d0;
  }
  .source-name-label { font-size: 11px; color: var(--muted); }
  .source-price-val  {
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .source-item.best .source-price-val { color: var(--green); }
  .source-no-data { color: var(--muted); font-style: italic; font-size: 11px; }
  /* ── Model Rankings ── */
  .models-section {
    border-top: 1px solid var(--border);
    padding: 14px 20px 18px;
  }
  .models-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .model-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .model-table th {
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    padding: 4px 8px;
    border-bottom: 1px solid var(--border);
  }
  .model-table th.right { text-align: right; }
  .model-table td {
    padding: 7px 8px;
    border-bottom: 1px solid var(--bg);
    vertical-align: middle;
  }
  .model-table tr:hover td { background: var(--bg); }
  .rank-num {
    font-size: 11px;
    font-weight: 800;
    color: var(--muted);
    width: 32px;
  }
  .rank-1 .rank-num { color: #d97706; }
  .rank-2 .rank-num { color: #6b7280; }
  .rank-3 .rank-num { color: #92400e; }
  .model-maker {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    width: 90px;
    white-space: nowrap;
  }
  .model-name { font-weight: 500; color: var(--text); }
  .model-name a {
    color: inherit;
    text-decoration: none;
  }
  .model-name a:hover { color: var(--accent); text-decoration: underline; }
  .model-price {
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    text-align: right;
    white-space: nowrap;
    width: 100px;
  }
  .model-price.msi { color: var(--accent); }
  .model-source {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    width: 80px;
    white-space: nowrap;
  }
  .models-empty {
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
    padding: 8px 0;
  }
  .date-selector-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .date-selector-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .date-selector-select {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 13px;
    color: var(--text);
    background: var(--white);
    cursor: pointer;
  }
  .date-selector-badge {
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
  }


  /* ── Market Matrix ── */
  .section-label small { font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: 8px; color: var(--muted); }
  .mx-block { margin-bottom: 14px; }
  .mx-title { font-size: 12px; font-weight: 800; margin: 0 0 6px 2px; display: flex; align-items: center; gap: 6px; }
  .matrix-wrap { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
  table.matrix { width: 100%; border-collapse: collapse; }
  .matrix th { font-size: 11px; font-weight: 700; color: var(--muted); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); background: #fafbfc; white-space: nowrap; }
  .matrix td { padding: 0; border-left: 1px solid var(--bg); vertical-align: top; }
  .matrix td:first-child { border-left: none; }
  .mx-cell { padding: 10px 12px; cursor: pointer; min-width: 128px; transition: background .12s; outline: none; }
  .mx-cell:hover, .mx-cell:focus-visible { background: #f5f8ff; }
  .mx-empty { padding: 10px 12px; color: #c4c8cf; font-size: 12px; }
  .mx-min { font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .mx-chg { font-size: 11px; font-weight: 700; margin-left: 6px; white-space: nowrap; }
  .mx-sub { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mx-sub b { color: var(--text); font-weight: 700; }
  .mx-msi { font-size: 11px; font-weight: 700; color: var(--accent); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .mx-legend { font-size: 11px; color: var(--muted); margin-bottom: 24px; }
  .gpu-card { scroll-margin-top: 72px; }
  @keyframes mxflash { 0% { box-shadow: 0 0 0 3px rgba(37,99,235,.55); } 100% { box-shadow: var(--shadow); } }
  .gpu-card.flash { animation: mxflash 1.6s ease-out; }

  /* ── Empty / No data ── */
  .no-pickup {
    color: var(--muted);
    font-size: 13px;
    padding: 8px 0 20px;
  }
  .card-no-data {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <div class="site-title">
    <div class="site-title-icon">📊</div>
    GPU 価格推移ダッシュボード
  </div>
  <div class="header-meta" id="last-updated">—</div>
</header>

<div class="container">

  <!-- Pick Up -->
  <div class="section-label pickup-head" id="pickup-head" role="button" tabindex="0" aria-expanded="true" title="クリックで開閉">
    <span class="caret" id="pickup-caret">▼</span>
    <span>⚡ Pick Up — 直近7日の変動 / 新着</span>
    <span class="pickup-count" id="pickup-count"></span>
  </div>
  <div class="pickup-list" id="pickup-list"></div>

  <!-- Market matrix -->
  <div class="section-label">📊 市場価格マトリクス<small>セルをクリックで該当GPUへ移動</small></div>
  <div id="matrix-area"></div>
  <div class="mx-legend">各セル: 最安値（前回比）／ 中央値・機種数 ／ <span style="color:var(--accent);font-weight:700">MSI最安（最安値との差）</span>　※正規代理店価格のみ</div>

  <!-- Filters -->
  <div class="section-label" id="detail-top">📋 GPU別詳細</div>
  <div class="tabs">
    <button class="tab active" data-series="RTX50" onclick="setPage('nvidia',this)">🟢 NVIDIA RTX 50</button>
    <button class="tab" data-series="RX9000" onclick="setPage('amd',this)">🔴 AMD RX 9000</button>
  </div>

  <!-- GPU list -->
  <div class="gpu-list" id="gpu-list"></div>

</div>

<script>
// ── Embedded data (injected by inject_data.py) ────────────────────────────
const PRICES_DATA = __PRICES_DATA__;

const SOURCE_LABELS = {
  kakaku: "kakaku.com",
};

const CHART_COLORS = {
  min:     { line: "#2563eb", fill: "rgba(37,99,235,.08)" },
  kakaku:  "#f59e0b",
  dospara: "#8b5cf6",
  tsukumo: "#06b6d4",
  unitcom: "#f97316",
  joshin:  "#ec4899",
  amazon:  "#10b981",
  sofmap:  "#6366f1",
};

let currentFilter = "RTX50";
const chartInstances = {};
const SERIES_LABELS = { RTX50: "RTX 50 Series", RX9000: "RX 9000 Series" };
const yen = n => n == null ? "—" : "¥" + Math.round(n).toLocaleString();

// ── Boot ─────────────────────────────────────────────────────────────────
(function init() {
  // Last updated
  const allDates = Object.values(PRICES_DATA)
    .flatMap(g => (g.history || []).map(h => h.date)).sort();
  const latest = allDates[allDates.length - 1];
  if (latest) {
    document.getElementById("last-updated").textContent = `最終更新: ${latest}`;
  }

  renderPickup();
  initPickupToggle();
  renderMatrix();
  renderGPUs();
})();

// ── Filter ───────────────────────────────────────────────────────────────
function setPage(page, btn) {
  switchSeries(page === 'nvidia' ? 'RTX50' : 'RX9000');
}

function switchSeries(series) {
  currentFilter = series;
  document.querySelectorAll(".tab").forEach(b =>
    b.classList.toggle("active", b.dataset.series === series));
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch(e){} });
  Object.keys(chartInstances).forEach(k => delete chartInstances[k]);
  renderGPUs();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch(e){} });
  Object.keys(chartInstances).forEach(k => delete chartInstances[k]);
  renderGPUs();
}

// ── Pick Up ───────────────────────────────────────────────────────────────
function renderPickup() {
  const list = document.getElementById("pickup-list");
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 7);
  const cutoffStr = cutoff.toISOString().slice(0, 10);

  const items = [];

  // Price change events
  for (const [gpu, data] of Object.entries(PRICES_DATA)) {
    for (const ev of (data.events || [])) {
      if (ev.date >= cutoffStr) items.push({ gpu, ...ev });
    }
  }

  // New products from model release dates (直近7日以内に発売)
  for (const [gpu, data] of Object.entries(PRICES_DATA)) {
    const history = data.history || [];
    const latestEntry = history[history.length - 1];
    const models = latestEntry?.models || [];
    for (const model of models) {
      if (model.release_date && model.release_date >= cutoffStr) {
        items.push({
          type: "new_product",
          gpu,
          date: model.release_date,
          maker: model.maker,
          name: model.name,
          price: model.price,
          url: model.url,
        });
      }
    }
  }

  items.sort((a, b) => b.date.localeCompare(a.date));

  const countEl = document.getElementById("pickup-count");
  if (!items.length) {
    countEl.textContent = "0件";
    list.innerHTML = `<p class="no-pickup">直近7日間に価格変動・新着商品はありません</p>`;
    return;
  }

  // 最新の1日分のみ表示。それ以前（7日以内）はボタンで展開
  const dayOf = e => e.date.slice(0, 10);
  const latestDay = dayOf(items[0]);
  const latest = items.filter(e => dayOf(e) === latestDay);
  const older  = items.filter(e => dayOf(e) !== latestDay);
  countEl.textContent = `最新 ${latestDay.slice(5)}：${pickupBreakdown(latest)}` +
    (older.length ? ` ／ 7日合計 ${items.length}件` : "");

  list.innerHTML = latest.map(pickupItemHtml).join("") + (older.length
    ? `<button type="button" class="pickup-more" id="pickup-more">▼ それ以前（7日以内）の ${older.length}件を表示</button>
       <div class="pickup-older" id="pickup-older" hidden>${older.map(pickupItemHtml).join("")}</div>` : "");
  const more = document.getElementById("pickup-more");
  if (more) more.addEventListener("click", () => {
    const box = document.getElementById("pickup-older");
    box.hidden = !box.hidden;
    more.textContent = box.hidden ? `▼ それ以前（7日以内）の ${older.length}件を表示` : `▲ それ以前の表示を閉じる`;
  });
}

function pickupBreakdown(arr) {
  const chg = e => e.type === "price_change";
  const up = arr.filter(e => chg(e) && e.current > e.prev).length;
  const down = arr.filter(e => chg(e) && e.current < e.prev).length;
  const nw = arr.filter(e => e.type === "new_product" || e.type === "new_model").length;
  return `${arr.length}件（値上がり ${up} ／ 値下がり ${down} ／ 新着 ${nw}）`;
}

function pickupItemHtml(ev) {
  if (ev.type === "new_product") {
    const nameHtml = ev.url
      ? `<a href="${ev.url}" target="_blank" style="color:inherit">${escHtml(ev.maker)} ${escHtml(ev.name)}</a>`
      : `${escHtml(ev.maker)} ${escHtml(ev.name)}`;
    return `
      <div class="pickup-item new">
        <span class="pickup-icon">🆕</span>
        <span class="pickup-text"><b>${ev.gpu}</b> — ${nameHtml} ¥${ev.price.toLocaleString()}</span>
        <span class="pickup-date">${ev.date}</span>
        <span class="pickup-badge badge-new">NEW</span>
      </div>`;
  }
  const isNew  = ev.type === "new_model";
  const isUp   = ev.type === "price_change" && ev.current > ev.prev;
  const cls    = isNew ? "new" : isUp ? "up" : "down";
  const icon   = isNew ? "🆕" : isUp ? "📈" : "📉";
  const badge  = isNew ? "NEW" : ev.change;
  const badgeCls = isNew ? "badge-new" : isUp ? "badge-up" : "badge-down";
  const detail = isNew
    ? `${ev.gpu} が初めて検出 — ¥${ev.price.toLocaleString()}`
    : `${ev.gpu}  ¥${ev.prev.toLocaleString()} → ¥${ev.current.toLocaleString()}`;
  return `
    <div class="pickup-item ${cls}">
      <span class="pickup-icon">${icon}</span>
      <span class="pickup-text">${detail}</span>
      <span class="pickup-date">${ev.date}</span>
      <span class="pickup-badge ${badgeCls}">${badge}</span>
    </div>`;
}

// Pick Up 開閉（状態はブラウザに保存）
function initPickupToggle() {
  const head = document.getElementById("pickup-head"), list = document.getElementById("pickup-list");
  const caret = document.getElementById("pickup-caret");
  function apply(collapsed, save) {
    head.classList.toggle("collapsed", collapsed);
    list.hidden = collapsed;
    caret.textContent = collapsed ? "▶" : "▼";
    head.setAttribute("aria-expanded", String(!collapsed));
    if (save) { try { localStorage.setItem("vga_pickup_collapsed", collapsed ? "1" : "0"); } catch (e) {} }
  }
  let collapsed = false;
  try { collapsed = localStorage.getItem("vga_pickup_collapsed") === "1"; } catch (e) {}
  apply(collapsed, false);
  const toggle = () => apply(!head.classList.contains("collapsed"), true);
  head.addEventListener("click", toggle);
  head.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
}

// ── Market Matrix ─────────────────────────────────────────────────────────

function gpuSlug(gpu) { return String(gpu).replace(/[^A-Za-z0-9]+/g, "-"); }

function medianOf(nums) {
  if (!nums.length) return null;
  const s = [...nums].sort((a, b) => a - b), m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

function matrixCell(gpu) {
  const history = PRICES_DATA[gpu].history || [];
  const last = history[history.length - 1];
  if (!last || last.min_price == null) return `<td class="mx-empty">—</td>`;

  let prev = null;
  for (let i = history.length - 2; i >= 0; i--) {
    if (history[i].min_price != null) { prev = history[i]; break; }
  }
  let chgHtml = "";
  if (prev) {
    const pct = (last.min_price - prev.min_price) / prev.min_price * 100;
    const cls = pct > 0 ? "change-up" : pct < 0 ? "change-down" : "change-flat";
    const arrow = pct > 0 ? "▲" : pct < 0 ? "▼" : "";
    chgHtml = pct === 0
      ? `<span class="mx-chg ${cls}">±0.0%</span>`
      : `<span class="mx-chg ${cls}">${arrow}${pct > 0 ? "+" : ""}${pct.toFixed(1)}%</span>`;
  }

  const models = last.models || [];
  const med = medianOf(models.map(m => m.price).filter(p => p != null));
  const msi = models.filter(m => m.maker === "MSI").sort((a, b) => a.price - b.price)[0];
  const msiLine = msi
    ? `<div class="mx-msi">MSI ${yen(msi.price)}${msi.price > last.min_price
        ? ` (+${((msi.price / last.min_price - 1) * 100).toFixed(0)}%)` : " (最安)"}</div>`
    : "";

  return `<td><div class="mx-cell" role="button" tabindex="0" data-gpu="${escHtml(gpu)}">
      <div><span class="mx-min">${yen(last.min_price)}</span>${chgHtml}</div>
      <div class="mx-sub">中央値 <b>${yen(med)}</b> ・ <b>${models.length}</b>機種</div>
      ${msiLine}
    </div></td>`;
}

function renderMatrix() {
  const area = document.getElementById("matrix-area");
  const groups = {};
  Object.entries(PRICES_DATA).forEach(([gpu, d]) => {
    const s = d.meta?.series ?? "other";
    (groups[s] = groups[s] || []).push(gpu);
  });

  area.innerHTML = Object.entries(groups).map(([series, gpus]) => {
    const vendor = PRICES_DATA[gpus[0]].meta?.vendor ?? "";
    const badge = vendor === "AMD" ? "badge-amd" : "badge-nvidia";
    return `<div class="mx-block">
      <div class="mx-title"><span class="vendor-badge ${badge}">${escHtml(vendor)}</span>${escHtml(SERIES_LABELS[series] ?? series)}</div>
      <div class="matrix-wrap"><table class="matrix">
        <thead><tr>${gpus.map(g => `<th>${escHtml(g)}</th>`).join("")}</tr></thead>
        <tbody><tr>${gpus.map(g => matrixCell(g)).join("")}</tr></tbody>
      </table></div>
    </div>`;
  }).join("");

  area.querySelectorAll(".mx-cell").forEach(el => {
    el.addEventListener("click", () => gotoGPU(el.dataset.gpu));
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); gotoGPU(el.dataset.gpu); }
    });
  });
}

function gotoGPU(gpu) {
  const series = PRICES_DATA[gpu]?.meta?.series;
  if (series && series !== currentFilter) switchSeries(series);
  const el = document.getElementById("card-" + gpuSlug(gpu));
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

// ── GPU Cards ─────────────────────────────────────────────────────────────
function renderGPUs() {
  const list = document.getElementById("gpu-list");
  list.innerHTML = "";

  const entries = Object.entries(PRICES_DATA).filter(([, d]) => {
    if (currentFilter === "all") return true;
    return (d.meta?.series ?? "") === currentFilter;
  });

  entries.forEach(([gpu, data], idx) => {
    const history = data.history || [];
    const vendor  = data.meta?.vendor ?? "NVIDIA";
    const card    = document.createElement("div");
    card.className = "gpu-card";
    card.id = "card-" + gpuSlug(gpu);
    const chartId = `chart-${idx}`;

    // Price info
    const latest  = history[history.length - 1];
    const prev    = history.length > 1 ? history[history.length - 2] : null;
    const minNow  = latest?.min_price ?? null;
    const minPrev = prev?.min_price ?? null;
    const sources = latest?.sources ?? {};
    const bestPrice = minNow;

    // Change
    let changeHtml = `<div class="card-change change-flat">前日比 —</div>`;
    if (minNow && minPrev) {
      const pct = (minNow - minPrev) / minPrev;
      const sign = pct > 0 ? "+" : "";
      const cls  = pct > 0 ? "change-up" : pct < 0 ? "change-down" : "change-flat";
      const arrow = pct > 0 ? "▲" : pct < 0 ? "▼" : "—";
      changeHtml = `<div class="card-change ${cls}">前日比 ${arrow} ${sign}${(pct*100).toFixed(1)}%</div>`;
    }

    // Source grid
    const sourceHtml = Object.entries(SOURCE_LABELS).map(([key, label]) => {
      const p = sources[key];
      if (!p) return `
        <div class="source-item">
          <span class="source-name-label">${label}</span>
          <span class="source-no-data">—</span>
        </div>`;
      const isBest = p === bestPrice;
      return `
        <div class="source-item${isBest ? " best" : ""}">
          <span class="source-name-label">${label}${isBest ? " ✓" : ""}</span>
          <span class="source-price-val">¥${p.toLocaleString()}</span>
        </div>`;
    }).join("");

    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-name-row">
            <span class="vendor-badge ${vendor === "AMD" ? "badge-amd" : "badge-nvidia"}">${vendor}</span>
            <span class="card-name">${gpu}</span>
          </div>
        </div>
        <div class="card-price-block">
          <div class="card-min-label">最安値</div>
          <div class="card-min-price">${minNow ? "¥" + minNow.toLocaleString() : "—"}</div>
          ${changeHtml}
        </div>
      </div>
      ${history.length > 0
        ? `<div class="card-chart"><canvas id="${chartId}"></canvas></div>`
        : `<div class="card-no-data">データがありません — scraper.py を実行してください</div>`
      }
      <div class="card-sources">
        <div class="sources-title">販売店別価格</div>
        <div class="source-grid">${sourceHtml}</div>
      </div>
      <div class="models-section" data-gpu="${gpu}">
        <div class="date-selector-bar">
          <span class="date-selector-label">📋 全モデル価格ランキング</span>
          <select class="date-selector-select" onchange="onDateChange('${gpu}', this.value, ${idx})">
            ${buildDateOptions(history)}
          </select>
          <span class="date-selector-badge">（正規代理店のみ）</span>
        </div>
        <div id="models-container-${idx}">${buildModelsHtml(data, null)}</div>
      </div>`;

    list.appendChild(card);

    if (history.length > 0) {
      requestAnimationFrame(() => buildChart(chartId, gpu, history, vendor));
    }
  });
}

// ── Model Rankings ───────────────────────────────────────────────────────────
function buildDateOptions(history) {
  // Only dates that have models data, most recent first
  const datesWithModels = history
    .filter(h => h.models && h.models.length > 0)
    .map(h => h.date)
    .reverse();

  if (!datesWithModels.length) return `<option value="">データなし</option>`;

  return datesWithModels.map((d, i) =>
    `<option value="${d}"${i === 0 ? " selected" : ""}>${d}${i === 0 ? "（最新）" : ""}</option>`
  ).join("");
}

function onDateChange(gpu, dateStr, idx) {
  const data = PRICES_DATA[gpu];
  const container = document.getElementById(`models-container-${idx}`);
  if (container) {
    container.innerHTML = buildModelsHtml(data, dateStr);
  }
}

function buildModelsHtml(data, targetDate) {
  const history = data.history || [];
  let models = [];

  if (targetDate) {
    // Find exact date match
    const entry = history.find(h => h.date === targetDate);
    if (entry && entry.models) models = entry.models;
  } else {
    // Walk history backwards to find latest entry with models
    for (let i = history.length - 1; i >= 0; i--) {
      if (history[i].models && history[i].models.length > 0) {
        models = history[i].models;
        break;
      }
    }
  }

  if (!models.length) {
    return `<div class="models-empty">この日付のデータはありません</div>`;
  }

  const rows = models.map((m, idx) => {
    const rank = idx + 1;
    const rankCls = rank <= 3 ? `rank-${rank}` : "";
    const isMSI = m.maker === "MSI";
    const priceCls = isMSI ? "model-price msi" : "model-price";
    const nameHtml = m.url
      ? `<a href="${m.url}" target="_blank">${escHtml(m.name)}</a>`
      : escHtml(m.name);
    return `
      <tr class="${rankCls}">
        <td class="rank-num">RANK ${rank}</td>
        <td class="model-maker">${escHtml(m.maker)}</td>
        <td class="model-name">${nameHtml}</td>
        <td class="${priceCls}">¥${m.price.toLocaleString()}</td>
        <td class="model-source">${escHtml(m.source || "kakaku")}</td>
      </tr>`;
  }).join("");

  return `
    <table class="model-table">
      <thead>
        <tr>
          <th></th>
          <th>Maker</th>
          <th>Model</th>
          <th class="right">Price</th>
          <th class="right">Source</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ── Chart ─────────────────────────────────────────────────────────────────
function buildChart(chartId, gpu, history, vendor) {
  const ctx = document.getElementById(chartId);
  if (!ctx) return;

  const labels = history.map(h => h.date.slice(5)); // MM-DD
  const sourceKeys = [...new Set(history.flatMap(h => Object.keys(h.sources || {})))];

  const accentColor = vendor === "AMD" ? "#dc2626" : "#2563eb";
  const accentFill  = vendor === "AMD" ? "rgba(220,38,38,.07)" : "rgba(37,99,235,.07)";

  const datasets = [
    {
      label: "最安値",
      data: history.map(h => h.min_price ?? null),
      borderColor: accentColor,
      backgroundColor: accentFill,
      borderWidth: 2.5,
      pointRadius: history.length > 30 ? 1 : 3,
      pointHoverRadius: 5,
      fill: true,
      tension: 0.35,
      spanGaps: true,
      order: 0,
    },
    ...sourceKeys.map((key, i) => ({
      label: SOURCE_LABELS[key] ?? key,
      data: history.map(h => h.sources?.[key] ?? null),
      borderColor: CHART_COLORS[key] ?? "#aaa",
      borderWidth: 1,
      pointRadius: 0,
      pointHoverRadius: 3,
      fill: false,
      tension: 0.35,
      spanGaps: true,
      borderDash: [4, 3],
      order: i + 1,
    })),
  ];

  const instance = new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            color: "#6b7280",
            boxWidth: 10,
            padding: 12,
            font: { size: 11 },
          },
        },
        tooltip: {
          backgroundColor: "#fff",
          borderColor: "#e4e6ea",
          borderWidth: 1,
          titleColor: "#1a1d23",
          bodyColor: "#374151",
          padding: 10,
          callbacks: {
            label: ctx => {
              const v = ctx.parsed.y;
              return v != null
                ? ` ${ctx.dataset.label}: ¥${v.toLocaleString()}`
                : ` ${ctx.dataset.label}: —`;
            },
          },
        },
      },
      scales: {
        x: {
          ticks: {
            color: "#9ca3af",
            font: { size: 11 },
            maxTicksLimit: 10,
            maxRotation: 0,
          },
          grid: { color: "#f3f4f6" },
        },
        y: {
          ticks: {
            color: "#9ca3af",
            font: { size: 11 },
            callback: v => "¥" + (v / 10000).toFixed(0) + "万",
          },
          grid: { color: "#f3f4f6" },
        },
      },
    },
  });

  chartInstances[chartId] = instance;
}
</script>
